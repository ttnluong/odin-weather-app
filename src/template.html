<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body> 
    <div class="container">
      <div class="app">
        <header>
          <div class="header-top">
            <h1 class="title">weather</h1>
            <form class="unit-form">
              <label class="unit-option"><input type="radio" name="unit" value="C" checked /><span>°C</span></label>
              <label class="unit-option"><input type="radio" name="unit" value="F" /><span>°F</span></label>
            </form>
          </div>
          <form class="location-form">
            <input class="location-input" type="text" id="input-location" name="location" placeholder="Search city">
            <button type="submit" id="submit">Enter</button>
          </form>
        </header>
        <main class="widget">
          <div class="info">
            <h2 class="location"></h2>
            <p class="date"></p>
          </div>
          <div class="weather-conditions">
            <img class="icon">
            <div class="wrapper">
              <h3 class="temp"></h3>
              <p class="description"></p>
            </div>
          </div>
          <div class="weather-details">
            <div class="wrapper">
              <h4>Wind</h4>
              <p class="wind"></p>
            </div>
            <div class="wrapper">
              <h4>Humidity</h4>
              <p class="humidity"></p>
            </div>
            <div class="wrapper">
              <h4>Feels like</h4>
              <p class="feelslike"></p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
