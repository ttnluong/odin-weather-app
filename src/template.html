<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body> 
    <header>
      <form>
        <div class="form-content">
            <label for="input-location">Location</label>
            <input type="text" id="input-location" name="location">
        </div>
        <button type="submit" id="submit">Enter</button>
      </form>
      <form class="unit-form">
        <label><input type="radio" name="unit" value="C" checked /> °C</label>
        <label><input type="radio" name="unit" value="F" /> °F</label>
      </form>
    </header>
    <main>
      <h2 class="location"></h2>
      <p class="date"></p>
      <h3 class="temp"></h3>
      <p class="description"></p>
    </main>
  </body>
</html>
